services:
  app-db:
    image: postgres:16-alpine
    container_name: app-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: appsecret
    expose:
      - "5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - app-network

  app-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_HOST: "app-db"
      DB_PORT: "5432"
      DB_USER: "appuser"
      DB_PASSWORD: "appsecret"
      DB_NAME: "appdb"
    depends_on:
      app-db:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
